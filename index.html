<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お買い物メモ</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 10px; background: #f9f9f9; }
    h1, h2 { color: #333; }
    .input-form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    input[type="text"] { flex: 1; min-width: 150px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; justify-content: space-between; background: white; padding: 10px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #ddd; }
    .item-info { display: flex; align-items: center; gap: 10px; }
    .item-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; background: #eee; }
    .bought { background: #e9ecef; text-decoration: line-through; color: #6c757d; }
  </style>
</head>
<body>

  <h1>お買い物リスト</h1>

  <div class="input-form">
    <input type="text" id="itemInput" placeholder="買うものを入力...">
    <input type="file" id="imageInput" accept="image/*" capture="environment">
    <button onclick="addItem()">追加</button>
  </div>

  <h2>買いたいもの</h2>
  <ul id="todoList"></ul>

  <h2>買ったもの</h2>
  <ul id="boughtList"></ul>

  <script>
    function addItem() {
      const textInput = document.getElementById('itemInput');
      const imageInput = document.getElementById('imageInput');
      const text = textInput.value.trim();

      if (!text) return;

      const file = imageInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          createItemElement(text, e.target.result, false);
        };
        reader.readAsDataURL(file);
      } else {
        createItemElement(text, null, false);
      }

      textInput.value = '';
      imageInput.value = '';
    }

    function createItemElement(text, imgSrc, isBought) {
      const li = document.createElement('li');
      if (isBought) li.classList.add('bought');

      const infoDiv = document.createElement('div');
      infoDiv.className = 'item-info';

      if (imgSrc) {
        const img = document.createElement('img');
        img.src = imgSrc;
        img.className = 'item-img';
        infoDiv.appendChild(img);
      }

      const span = document.createElement('span');
      span.textContent = text;
      infoDiv.appendChild(span);

      const actionBtn = document.createElement('button');
      actionBtn.textContent = isBought ? '戻す' : '買った！';
      actionBtn.onclick = function() {
        li.remove();
        createItemElement(text, imgSrc, !isBought);
      };

      li.appendChild(infoDiv);
      li.appendChild(actionBtn);

      const targetList = isBought ? document.getElementById('boughtList') : document.getElementById('todoList');
      targetList.appendChild(li);
    }
  </script>
</body>
</html>
